<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
  <h2>SwiftAI ERP - API Login Test</h2>
  <div id="result" style="font-family:monospace;white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px;"></div>
  <script>
    async function test() {
      const log = document.getElementById('result');
      log.textContent = 'Testing API connection...\n\n';

      try {
        log.textContent += '1. POST to http://localhost:8080/api/v1/auth/login\n';
        const resp = await fetch('http://localhost:8080/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'admin@test.com', password: 'test123456' })
        });
        log.textContent += `   Status: ${resp.status} ${resp.statusText}\n`;
        log.textContent += `   Headers: ${JSON.stringify([...resp.headers])}\n\n`;
        const data = await resp.json();
        log.textContent += `   Response: ${JSON.stringify(data, null, 2)}\n`;
        if (data.success) {
          log.textContent += '\n✅ LOGIN WORKS!\n';
        }
      } catch (e) {
        log.textContent += `\n❌ ERROR: ${e.message}\n`;
      }
    }
    test();
  </script>
</body>
</html>
