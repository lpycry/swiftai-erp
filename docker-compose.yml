version: "3.9"

services:
  # --- Database ---
  postgres:
    image: postgres:16-alpine
    container_name: swiftai-postgres
    environment:
      POSTGRES_DB: swiftai_erp
      POSTGRES_USER: swiftai
      POSTGRES_PASSWORD: swiftai_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftai -d swiftai_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache ---
  redis:
    image: redis:7-alpine
    container_name: swiftai-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Message Broker ---
  nats:
    image: nats:2.10-alpine
    container_name: swiftai-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Object Storage ---
  minio:
    image: minio/minio:latest
    container_name: swiftai-minio
    environment:
      MINIO_ROOT_USER: swiftai
      MINIO_ROOT_PASSWORD: swiftai_dev_pass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- Time-Series DB ---
  timescaledb:
    image: timescale/timescaledb:2-pg16
    container_name: swiftai-timescaledb
    environment:
      POSTGRES_DB: swiftai_analytics
      POSTGRES_USER: swiftai
      POSTGRES_PASSWORD: swiftai_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftai -d swiftai_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Search Engine ---
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: swiftai-meilisearch
    environment:
      MEILI_MASTER_KEY: swiftai_dev_master_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data

  # --- Auth Service (merged: handles all API + auth logic) ---
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: auth-service
    container_name: swiftai-auth
    environment:
      APP_ENV: development
      CONFIG_PATH: /app/config/config.dev.yaml
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["go", "run", "./cmd/auth-service"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  tsdata:
  meilidata:
