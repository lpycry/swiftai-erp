apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftai-erp
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: swiftai-erp/auth-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: APP_ENV
          value: "production"
        - name: CONFIG_PATH
          value: "/app/config/config.prod.yaml"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swiftai-secrets
              key: db_password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: swiftai-secrets
              key: jwt_secret
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: swiftai-secrets
              key: redis_password
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: swiftai-erp
spec:
  selector:
    app: auth-service
  ports:
  - port: 8081
    targetPort: 8081
  type: ClusterIP
