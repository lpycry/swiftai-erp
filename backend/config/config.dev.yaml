app:
  name: "swiftai-erp"
  env: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 10s

database:
  host: "localhost"
  port: 5432
  user: "swiftai"
  password: "swiftai_dev_pass"
  dbname: "swiftai_erp"
  sslmode: "disable"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 5m

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0

nats:
  url: "nats://localhost:4222"

jwt:
  secret: "dev-jwt-secret-change-in-production"
  access_ttl: 24h
  refresh_ttl: 168h
  issuer: "swiftai-erp"

minio:
  endpoint: "localhost:9000"
  access_key: "swiftai"
  secret_key: "swiftai_dev_pass"
  use_ssl: false
  bucket: "swiftai-documents"

meilisearch:
  host: "http://localhost:7700"
  api_key: "swiftai_dev_master_key"

claude:
  api_key: ""
  model: "claude-opus-4-20250514"
  timeout: 60s
